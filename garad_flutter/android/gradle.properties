# Kept modest: this laptop's page file is on a nearly full C: drive.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project is on D: and the Flutter package cache on C:. Kotlin's incremental caches cannot
# be closed across drives on Windows ("Could not close incremental caches"), so build in full.
kotlin.incremental=false
