name: Android

# Builds an installable APK (for direct download/testing) and an AAB (for Google Play).
# Pushing a tag such as v1.0.0 also publishes both files on a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform android --platform ios --output-dir dist

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install

      - name: Restore upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "GARAD_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        working-directory: android
        env:
          GARAD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          GARAD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GARAD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          suffix=$([ "$HAS_UPLOAD_KEY" = "true" ] && echo "" || echo "-unsigned-for-store")
          cp android/app/build/outputs/apk/release/app-release.apk "out/garad-ai${suffix}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/garad-ai${suffix}.aab"
          if [ "$HAS_UPLOAD_KEY" != "true" ]; then
            echo "::warning::No upload key configured. The APK installs for testing but Google Play will reject these files."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: garad-ai-android
          path: out/*
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
