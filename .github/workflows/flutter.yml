name: Flutter app

# Checks the Garad AI Flutter app (garad_flutter/) on every push and pull request:
# code analysis and tests, then an Android APK to download from the run's page.
on:
  push:
    branches: [main]
    paths: ['garad_flutter/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['garad_flutter/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: garad_flutter

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter test

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      # API_URL / SITE_URL come from the repository's Actions variables when set.
      - run: >
          flutter build apk --release
          --dart-define=API_URL=${{ vars.API_URL }}
          --dart-define=SITE_URL=${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: garad-ai-apk
          path: garad_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
